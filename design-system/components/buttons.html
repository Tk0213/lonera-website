<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buttons and chips</title>
<style>
:root{--bg:#ffffff; --surface:#f7f7f7; --surface-2:#efefef;
  --text:#222222;            /* 15.9:1 on white */
  --text-2:#5a5a5a;          /* 7.0:1 on white  */
  --line:#dddddd;
  --brand:#ff385c;           /* Rausch, fills + large glyphs only */
  --brand-ink:#c9134a;       /* 5.4:1 on white, safe for small text */
  --brand-btn:#e31c5f;       /* white on this = 4.6:1 */
  --brand-tint:#fff1f4;
  --ok:#0b7a5a; --ok-tint:#e6f5f0;
  --warn:#8a5a00; --warn-tint:#fdf3e2;
  --r:14px; --r-lg:22px; --r-sheet:26px;
  --tap:52px;                /* generous: this audience skews older */
  --safe-b:26px;}
.chip{flex-shrink:0;background:var(--bg);border:1.5px solid var(--line);color:var(--text);font-size:.88rem;
  font-weight:700;padding:0 17px;height:46px;border-radius:999px;transition:transform .14s ease-out,border-color .14s ease-out,background .14s ease-out;}
.chip:hover{transform:scale(1.04);border-color:var(--brand);}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--text);color:#fff;border-color:var(--text);}
.btn{border:none;border-radius:var(--r);min-height:var(--tap);font-size:1rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s ease-out,background .14s ease-out;width:100%;}
.btn:hover{transform:scale(1.02);}
.btn:active{transform:scale(.96);}
.btn.pri{background:var(--brand-btn);color:#fff;}
.btn.pri:hover{background:#c9134a;}
.btn.sec{background:var(--bg);color:var(--text);border:1.5px solid var(--text);}
.btn.sec:hover{background:var(--surface);}
.slot{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:0 15px;height:46px;
  font-size:.9rem;font-weight:700;transition:transform .14s ease-out,border-color .14s ease-out,background .14s ease-out;}
.slot:hover{transform:scale(1.05);border-color:var(--brand);}
.slot:active{transform:scale(.96);}
.slot.on{background:var(--text);color:#fff;border-color:var(--text);}

*{box-sizing:border-box}
body{margin:0;padding:22px;background:var(--bg);color:var(--text);
  font-family:Manrope,"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif}
button{font-family:inherit;cursor:pointer}
.ds-h{margin:0 0 4px;font-size:.78rem;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text-2)}
.ds-note{margin:0 0 16px;font-size:.82rem;color:var(--text-2);line-height:1.5;max-width:60ch}
.ds-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic-s{width:16px;height:16px}

</style></head><body>
<p class="ds-h">Buttons and chips</p>
<p class="ds-note">Every pressable scales to 0.96 on press - one value across the whole app. Primary clears 4.6:1 for white text; secondary carries a full-weight border rather than a tint.</p>
<div style="width:320px;max-width:100%;display:flex;flex-direction:column;gap:9px"><button class="btn pri">Choose this business</button><button class="btn sec">Book a time</button><button class="btn sec">Save</button></div><p class="ds-note" style="margin-top:20px">Chips and slots</p><div class="ds-row"><button class="chip on">Cleaning</button><button class="chip">Rentals</button><button class="chip">Tutoring</button></div><div class="ds-row" style="margin-top:10px"><button class="slot on">Wed</button><button class="slot">Thu</button><button class="slot">11:30 AM</button></div>
</body></html>
