<title>Lonera App Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

:root{
  --bg:#ffffff; --surface:#f7f7f7; --surface-2:#efefef;
  --text:#222222;            /* 15.9:1 on white */
  --text-2:#5a5a5a;          /* 7.0:1 on white  */
  --line:#dddddd;
  --brand:#ff385c;           /* Rausch, fills + large glyphs only */
  --brand-ink:#c9134a;       /* 5.4:1 on white, safe for small text */
  --brand-btn:#e31c5f;       /* white on this = 4.6:1 */
  --brand-tint:#fff1f4;
  --ok:#0b7a5a; --ok-tint:#e6f5f0;
  --warn:#8a5a00; --warn-tint:#fdf3e2;
  --r:14px; --r-lg:22px; --r-sheet:26px;
  --tap:52px;                /* generous: this audience skews older */
  --safe-b:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#e9eaec;font-family:Manrope,"Noto Sans KR",-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
  padding:22px 14px;color:var(--text);}
button{font-family:inherit;cursor:pointer;}

.stage{display:flex;flex-direction:column;align-items:center;gap:12px;}
.stage > h1{margin:0;font-size:.95rem;font-weight:800;color:#222;}
.stage > p{margin:0;font-size:.8rem;color:#6a6a6a;text-align:center;max-width:390px;line-height:1.5;}

.phone{width:390px;max-width:100%;height:844px;max-height:calc(100dvh - 92px);background:var(--bg);border-radius:42px;
  border:1px solid #d3d5d8;box-shadow:0 30px 70px rgba(0,0,0,.22);overflow:hidden;position:relative;display:flex;flex-direction:column;}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#111;border-radius:18px;z-index:80;}
.statusbar{height:42px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px 5px;font-size:.76rem;font-weight:700;position:relative;z-index:70;}

/* ---------- scroll area ---------- */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
.screen::-webkit-scrollbar{display:none;}
.view{display:none;padding-bottom:20px;}
.view.on{display:block;}

.head{padding:6px 20px 2px;}
.head h2{margin:0;font-size:1.62rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
.head p{margin:6px 0 0;font-size:.9rem;color:var(--text-2);line-height:1.5;}

/* ---------- interactive card: outline + grow ---------- */
.card{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);
  border-radius:var(--r-lg);padding:0;overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.8,.3,1), border-color .16s, box-shadow .16s;}
.card:hover,.card:focus-visible{transform:scale(1.022);border-color:var(--brand);
  box-shadow:0 10px 26px rgba(255,56,92,.14);outline:none;}
.card:active{transform:scale(.96);}
.card .pic{height:120px;position:relative;display:flex;align-items:flex-end;padding:10px;}
.card .pic span.badge{background:rgba(255,255,255,.95);color:var(--text);font-size:.68rem;font-weight:800;
  padding:5px 9px;border-radius:8px;}
.card .b{padding:12px 14px 14px;}

/* ---------- Netflix poster: 2:3, text over a scrim ---------- */
.poster{display:block;text-align:left;background:none;border:none;padding:0;width:100%;
  transition:transform .17s cubic-bezier(.2,.8,.3,1);}
.poster:hover,.poster:focus-visible{transform:scale(1.045);outline:none;}
.poster:hover .pw,.poster:focus-visible .pw{outline:2px solid var(--brand);outline-offset:-2px;box-shadow:0 14px 30px rgba(255,56,92,.22);}
.poster:active{transform:scale(.96);}
.pw{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;
  outline:1px solid oklch(0 0 0 / 0.1);outline-offset:-1px;
  display:flex;align-items:flex-end;transition:border-color .17s ease-out,box-shadow .17s ease-out,outline-color .17s ease-out;}
/* drawn artwork layer: sits on the gradient, under the scrim */
.art{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block;}
.pw::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.34) 38%,rgba(0,0,0,0) 68%);}
.pw .flag{position:absolute;top:9px;left:9px;z-index:3;background:rgba(255,255,255,.96);color:var(--text);
  font-size:.66rem;font-weight:800;padding:4px 8px;border-radius:9px;}
.pw .pt{position:relative;z-index:2;padding:11px 12px;width:100%;color:#fff;}
.pw .pp{font-size:.74rem;font-weight:800;margin:0 0 3px;color:#ffd9e2;}
.pw .pn{font-size:.9rem;font-weight:800;margin:0;line-height:1.28;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.poster .pmeta{font-size:.78rem;color:var(--text-2);margin:8px 2px 0;font-weight:600;}

/* ---------- Netflix hero: full bleed, one big tap target ---------- */
.hero{position:relative;width:100%;border:none;background:none;padding:0;display:block;text-align:left;
  transition:transform .18s cubic-bezier(.2,.8,.3,1);}
.hero:hover,.hero:focus-visible{transform:scale(1.012);outline:none;}
.hero:hover .hw{box-shadow:inset 0 0 0 3px var(--brand);}
.hero:active{transform:scale(.96);}
.hw{position:relative;height:356px;display:flex;align-items:flex-end;overflow:hidden;
  transition:box-shadow .18s ease-out;}
.hw::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,#fff 4%,rgba(255,255,255,.92) 34%,rgba(255,255,255,.34) 58%,rgba(255,255,255,0) 82%);}
/* the hero drawing lives in the top two thirds and dissolves into the page,
   so the headline never sits on top of it */
.hw .art{inset:0 0 auto 0;height:66%;
  -webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 58%,transparent 100%);}
.hb{position:relative;z-index:2;padding:0 20px 18px;width:100%;}
.hflag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-btn);color:#fff;font-size:.68rem;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:999px;margin-bottom:11px;}
.hb h2{margin:0 0 7px;font-size:1.92rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--text);}
.hb .hm{margin:0 0 7px;font-size:.86rem;font-weight:700;color:var(--text-2);}
.hb .hd{margin:0 0 13px;font-size:.9rem;line-height:1.5;color:var(--text-2);}
.hcue{display:inline-flex;align-items:center;gap:7px;background:var(--text);color:#fff;font-size:.88rem;
  font-weight:800;padding:11px 17px 11px 15px;border-radius:12px;}

/* ---------- Featured rail: swipe between full-width hero slides ---------- */
.herorail{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.herorail::-webkit-scrollbar{display:none;}
.herorail .hero{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;}
.herorail .hero:hover,.herorail .hero:focus-visible{transform:none;}   /* scaling a snap slide fights the scroller */
.herodots{display:flex;justify-content:center;align-items:center;gap:1px;padding:9px 0 0;}
.hdot{background:none;border:none;padding:0;width:28px;height:28px;display:flex;
  align-items:center;justify-content:center;border-radius:50%;transition:background .16s ease-out,transform .16s ease-out;}
.hdot i{display:block;width:8px;height:8px;border-radius:99px;background:#c8c8c8;
  transition:width .22s cubic-bezier(.2,.8,.3,1),background .22s;}
.hdot[aria-current="true"] i{width:24px;background:var(--brand-btn);}
.hdot:hover{background:var(--brand-tint);}
.hdot:hover i{background:var(--brand);}
.hdot:active{transform:scale(.96);}
.hdot:focus-visible{outline:2.5px solid var(--brand);outline-offset:-2px;}
.card .t{font-size:.98rem;font-weight:800;margin:0 0 3px;line-height:1.3;}
.card .s{font-size:.84rem;color:var(--text-2);margin:0;line-height:1.45;}
.card .p{font-size:.94rem;font-weight:800;margin:8px 0 0;color:var(--text);}

.rail{display:flex;gap:12px;overflow-x:auto;padding:12px 20px 6px;scroll-snap-type:x proximity;
  scroll-padding-inline:20px;scrollbar-width:none;}  /* snap respects the gutter */
.rail::-webkit-scrollbar{display:none;}
.rail .card{flex:0 0 216px;scroll-snap-align:start;}
.rail .poster{flex:0 0 138px;scroll-snap-align:start;}
.rowtitle{display:flex;align-items:baseline;gap:8px;padding:20px 20px 0;}
.rowtitle h3{margin:0;font-size:1.12rem;font-weight:800;letter-spacing:-.01em;}
.rowtitle .ko{font-size:.82rem;color:var(--brand-ink);font-weight:700;}

.g1{background:linear-gradient(160deg,#ffd9cb 8%,#ffa588 92%);} .g2{background:linear-gradient(160deg,#ffe2ec 8%,#ff9ebb 92%);}
.g3{background:linear-gradient(160deg,#d6f2e8 8%,#94d3bd 92%);} .g4{background:linear-gradient(160deg,#ffecce 8%,#ffc571 92%);}
.g5{background:linear-gradient(160deg,#dde7ff 8%,#9fb6ef 92%);} .g6{background:linear-gradient(160deg,#eae0ff 8%,#b9a4ec 92%);}

.stack{padding:14px 20px 0;display:flex;flex-direction:column;gap:12px;}
.chips{display:flex;gap:9px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;background:var(--bg);border:1.5px solid var(--line);color:var(--text);font-size:.88rem;
  font-weight:700;padding:0 17px;height:46px;border-radius:999px;transition:transform .14s ease-out,border-color .14s ease-out,background .14s ease-out;}
.chip:hover{transform:scale(1.04);border-color:var(--brand);}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--text);color:#fff;border-color:var(--text);}

.row{display:flex;gap:13px;align-items:center;width:100%;background:var(--bg);border:1.5px solid var(--line);
  border-radius:var(--r);padding:13px;text-align:left;transition:transform .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out;}
.row:hover,.row:focus-visible{transform:scale(1.02);border-color:var(--brand);box-shadow:0 8px 20px rgba(255,56,92,.12);outline:none;}
.row:active{transform:scale(.96);}
.av{width:50px;height:50px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.05rem;color:#7a3b2e;}
.row .bd{flex:1;min-width:0;}
.row .t{font-size:.94rem;font-weight:800;margin:0 0 3px;}
.row .s{font-size:.82rem;color:var(--text-2);margin:0;}
.tagp{font-size:.72rem;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;}
.tagp.ok{background:var(--ok-tint);color:var(--ok);} .tagp.w{background:var(--warn-tint);color:var(--warn);}
.tagp.n{background:var(--brand-tint);color:var(--brand-ink);}

.empty{padding:56px 34px;text-align:center;}
.empty p{margin:14px 0 6px;font-size:1rem;font-weight:800;}
.empty span{font-size:.88rem;color:var(--text-2);line-height:1.55;}

/* ---------- BOTTOM CONTROL DECK (everything tappable lives here) ---------- */
.deck{flex-shrink:0;background:var(--bg);border-top:1.5px solid var(--line);
  padding:10px 14px calc(var(--safe-b) + 4px);position:relative;z-index:40;}
.searchdock{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:999px;padding:5px 6px 5px 16px;margin-bottom:9px;transition:border-color .16s ease-out,transform .16s ease-out;}
.searchdock:focus-within{border-color:var(--brand);transform:scale(1.012);}
.searchdock input{flex:1;background:none;border:none;outline:none;font-family:inherit;font-size:1rem;
  font-weight:600;color:var(--text);min-width:0;height:46px;}
.searchdock input::placeholder{color:#767676;font-weight:500;}
.voicebtn{width:52px;height:52px;border-radius:50%;background:var(--brand-btn);border:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .16s ease-out,box-shadow .16s ease-out,background .16s ease-out;
  box-shadow:0 4px 14px rgba(227,28,95,.36);}
.voicebtn:hover{transform:scale(1.07);}
.voicebtn:active{transform:scale(.96);}
/* Listening state carries colour + a ring + an icon swap, so it survives
   the reduced-motion block that switches the pulse off entirely. */
.voicebtn.live{background:var(--text);box-shadow:0 0 0 3px var(--brand-tint);animation:pulse 1.3s infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 3px var(--brand-tint),0 0 0 0 rgba(227,28,95,.5);}
  70%{box-shadow:0 0 0 3px var(--brand-tint),0 0 0 16px rgba(227,28,95,0);}
  100%{box-shadow:0 0 0 3px var(--brand-tint),0 0 0 0 rgba(227,28,95,0);}}
/* cross-fade mic <-> stop: both stay in the DOM so enter and exit animate */
.vicon{position:relative;width:22px;height:22px;display:block;}
.vicon .ic{position:absolute;inset:0;
  transition-property:opacity,filter,scale;
  transition-duration:.3s;transition-timing-function:cubic-bezier(0.2,0,0,1);}
.vmic{opacity:1;scale:1;filter:blur(0px);}
.vstop{opacity:0;scale:.25;filter:blur(4px);}
.voicebtn.live .vmic{opacity:0;scale:.25;filter:blur(4px);}
.voicebtn.live .vstop{opacity:1;scale:1;filter:blur(0px);}

.tabs{display:flex;gap:2px;}
.tab{flex:1;background:none;border:none;padding:7px 2px 3px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:#6a6a6a;font-size:.66rem;font-weight:700;min-height:var(--tap);
  border-radius:12px;transition:transform .14s ease-out,color .14s ease-out,background .14s ease-out;position:relative;}
.tab:hover{transform:scale(1.06);background:var(--surface);}
.tab:active{transform:scale(.96);}
.tab.on{color:var(--brand-ink);}
.tab .dot{position:absolute;top:5px;right:22%;background:var(--brand-btn);color:#fff;font-size:.58rem;
  font-weight:800;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ---------- bottom sheet: every action opens here, in reach ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;
  transition:opacity .24s ease-out;z-index:50;}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:60;max-height:82%;
  display:flex;flex-direction:column;box-shadow:0 -8px 34px rgba(0,0,0,.18);}
.sheet.on{transform:translateY(0);}
.grip{width:42px;height:5px;border-radius:99px;background:var(--line);margin:11px auto 4px;flex-shrink:0;}
.sheet-body{overflow-y:auto;padding:8px 20px 4px;scrollbar-width:none;}
.sheet-body::-webkit-scrollbar{display:none;}
.sheet h3{margin:6px 0 4px;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;}
.sheet .sub{margin:0 0 14px;font-size:.9rem;color:var(--text-2);line-height:1.5;}
.sheet-foot{padding:12px 20px calc(var(--safe-b) + 10px);border-top:1.5px solid var(--line);
  display:flex;flex-direction:column;gap:9px;flex-shrink:0;background:var(--bg);}

.btn{border:none;border-radius:var(--r);min-height:var(--tap);font-size:1rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s ease-out,background .14s ease-out;width:100%;}
.btn:hover{transform:scale(1.02);} .btn:active{transform:scale(.96);}
.btn.pri{background:var(--brand-btn);color:#fff;}
.btn.pri:hover{background:#c9134a;}
.btn.sec{background:var(--bg);color:var(--text);border:1.5px solid var(--text);}
.btn.sec:hover{background:var(--surface);}

.field{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:13px 14px;font-family:inherit;
  font-size:1rem;font-weight:500;color:var(--text);background:var(--bg);min-height:var(--tap);transition:border-color .16s ease-out;}
.field:focus{outline:none;border-color:var(--brand);}
label.lb{display:block;font-size:.85rem;font-weight:800;margin:12px 0 6px;}
.note{background:var(--surface);border-left:4px solid var(--brand);border-radius:0 12px 12px 0;
  padding:12px 14px;font-size:.92rem;line-height:1.5;margin:4px 0 0;}
.aiflag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-tint);color:var(--brand-ink);
  font-size:.74rem;font-weight:800;padding:5px 10px;border-radius:999px;margin-bottom:8px;}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.slot{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:0 15px;height:46px;
  font-size:.9rem;font-weight:700;transition:transform .14s ease-out,border-color .14s ease-out,background .14s ease-out;}
.slot:hover{transform:scale(1.05);border-color:var(--brand);}
.slot:active{transform:scale(.96);}
.slot.on{background:var(--text);color:#fff;border-color:var(--text);}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1.5px solid var(--line);
  padding:15px 2px;text-align:left;font-size:1rem;font-weight:700;min-height:var(--tap);transition:background .14s ease-out,transform .14s ease-out;}
.opt:hover{background:var(--surface);transform:scale(1.01);}
.opt:active{transform:scale(.96);}
.opt:last-child{border-bottom:none;}
.opt .rt{margin-left:auto;font-size:.88rem;color:var(--text-2);font-weight:700;}
.sw{width:50px;height:30px;border-radius:99px;background:#c9c9c9;position:relative;flex-shrink:0;transition:background .2s ease-out;margin-left:auto;}
.sw.on{background:var(--brand-btn);}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s ease-out;
  box-shadow:0 1px 3px rgba(0,0,0,.28);}
.sw.on i{transform:translateX(20px);}

.toast{position:absolute;left:14px;right:14px;bottom:calc(var(--safe-b) + 128px);background:var(--text);color:#fff;
  border-radius:var(--r);padding:14px 16px;font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:9px;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .22s ease-out,transform .22s ease-out;z-index:70;}
.toast.on{opacity:1;transform:translateY(0);}

.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.ic-s{width:16px;height:16px;}
.trust{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.tb{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:5px 9px 5px 7px;border-radius:999px;
  background:var(--ok-tint);color:var(--ok);}
.tb.b{background:#eaf1fb;color:#1a4d8f;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
/* Real phone: drop the mockup and become the app. The device already has a
   notch, a status bar and a home indicator, so drawing our own on top of them
   wastes 42px and looks broken. 100dvh (not 100vh) so the bottom deck stays
   on screen while the browser chrome shows and hides. */
@media (max-width:600px){
  body{padding:0;display:block;background:var(--bg);}
  .stage{gap:0;display:block;}
  .stage > h1,.stage > p{display:none;}
  .phone{width:100%;max-width:none;height:100vh;height:100dvh;max-height:none;
    border-radius:0;border:none;box-shadow:none;}
  .notch,.statusbar{display:none;}
  :root{--safe-b:max(14px,env(safe-area-inset-bottom));}
}
/* Short landscape window: same treatment, the mockup cannot fit */
@media (max-height:560px) and (min-width:601px){
  body{padding:0;}
  .stage > h1,.stage > p{display:none;}
  .phone{height:100dvh;max-height:none;border-radius:0;border:none;}
  .notch,.statusbar{display:none;}
}
</style>

<div class="stage">
  <h1>Lonera - app prototype</h1>
  <p>Every control sits in the bottom third, reachable with one thumb. Tap anything.</p>

  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span id="clk">9:41</span>
      <span style="display:flex;gap:5px;align-items:center">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="3" stroke="currentColor" opacity=".4"/><rect x="2.2" y="2.2" width="15.5" height="7.6" rx="1.6" fill="currentColor"/></svg>
      </span>
    </div>

    <div class="screen" id="screen">
      <section class="view on" id="v-home"></section>
      <section class="view" id="v-browse"></section>
      <section class="view" id="v-saved"></section>
      <section class="view" id="v-inbox"></section>
      <section class="view" id="v-you"></section>
    </div>

    <div class="toast" id="toast"><svg class="ic ic-s" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg><span id="toastT"></span></div>

/* swipeable Featured rail. Manual only: no auto-advance, so nothing
   moves under a slow reader and there is no pause control to hunt for. */
const FEAT=BIZ.filter(b=>b.f);
function heroRail(){
  return `<div class="herorail" id="herorail" tabindex="0" role="group"
      aria-roledescription="carousel" aria-label="${t("featuredNow")}">
      ${FEAT.map(heroCard).join("")}
    </div>
    <div class="herodots" id="herodots" role="tablist" aria-label="${t("featuredNow")}">
      ${FEAT.map((b,i)=>`<button class="hdot" role="tab" data-dot="${i}"
        aria-current="${i===0}" aria-label="${esc(bn(b))}"><i></i></button>`).join("")}
    </div>`;
}
function wireHeroRail(){
  const r=$("herorail"); if(!r) return;
  const dots=[...document.querySelectorAll("#herodots .hdot")];
  let last=-1;
  const sync=()=>{
    const i=Math.round(r.scrollLeft/Math.max(1,r.clientWidth));
    if(i===last) return; last=i;
    dots.forEach((d,n)=>d.setAttribute("aria-current",String(n===i)));
  };
  /* sync straight from the scroll event: rAF is throttled in a background
     tab, and the dots would then lie about which slide is showing. */
  r.addEventListener("scroll",sync,{passive:true});
  sync();
}
function goSlide(i){
  const r=$("herorail"); if(!r) return;
  r.scrollTo({left:i*r.clientWidth,
    behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}

/* voice/text request -> tidy -> send */
function tidy(s){
  s=s.trim().replace(/\s+/g," "); if(!s) return "";
  if(/[\uAC00-\uD7A3]/.test(s)) return /[.!?\u2026]$/.test(s)?s:s+".";
  s=s.charAt(0).toUpperCase()+s.slice(1);
  s=s.replace(/\bi\b/g,"I").replace(/\bim\b/gi,"I'm");
  return /[.!?]$/.test(s)?s:s+".";
}

}
function openBizPortal(){
  sheet(t("runBiz"),lang==="ko"?"업체용 화면 미리보기예요.":"A preview of the business side.",
    `<div style="display:flex;flex-direction:column;gap:10px">
      ${rowItem(lang==="ko"?"새 요청 2건":"2 new requests",lang==="ko"?"답변을 기다리고 있어요":"Waiting for your reply","2","n","g2")}
      ${rowItem(lang==="ko"?"이번 주 예약 4건":"4 bookings this week",lang==="ko"?"오늘 2건":"2 today","","ok","g3")}
      ${rowItem(lang==="ko"?"에스크로 보관 $340":"$340 held safely",lang==="ko"?"작업 완료 시 지급":"Released when the job is done","","ok","g4")}
     </div>`,
    `<button class="btn sec" data-act="close">${t("closeCmp")}</button>`);
}
function openSize(){
  sheet(t("textSize"),"",
    `<div class="slots">
      <button class="slot${scale===1?" on":""}" data-size="1">${t("sizeS")}</button>
      <button class="slot${scale===1.15?" on":""}" data-size="1.15">${t("sizeL")}</button>
      <button class="slot${scale===1.3?" on":""}" data-size="1.3">${t("sizeXL")}</button>
     </div>`,

/* ================= voice ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
if(SR){rec=new SR();rec.interimResults=false;rec.maxAlternatives=1;
  const mic=(on)=>{listening=on;$("voice").classList.toggle("live",on);
    $("voice").setAttribute("aria-label",on?t("listening"):t("askVoice"));};
  rec.onstart=()=>{mic(true);toast(t("listening"));};
  rec.onend=()=>mic(false);
  rec.onerror=()=>{mic(false);toast(t("tNoVoice"));};
  rec.onresult=e=>{const said=e.results[0][0].transcript;toast(`${t("heard")}: "${said}"`);route(said);};
}
$("voice").onclick=()=>{
  if(!rec){toast(t("tNoVoice"));$("q").focus();return;}
  if(listening){rec.stop();return;}
  rec.lang=lang==="ko"?"ko-KR":"en-CA";
  try{rec.start();}catch(e){toast(t("tNoVoice"));}
};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&$("q").value.trim())route($("q").value.trim());});

/* voice/text intent routing */
function route(said){
  const s=said.toLowerCase();
  const wantsCommunity=/ask the community|\ucee4\ubba4\ub2c8\ud2f0\uc5d0|community/.test(s);
  const wantsHelp=/support|platform|\uace0\uac1d\uc13c\ud130|\ubb38\uc758/.test(s);
  const wantsJob=/job|hiring|\ucc44\uc6a9|\uad6c\uc778/.test(s);
  const wantsBuy=/buy|sell|\uc911\uace0|\ud314/.test(s);
  if(wantsCommunity){go("home");openForm("ask");return;}
  if(wantsHelp){go("you");openForm("help");return;}
  if(wantsJob){go("home");toast(t("rowJobs"));return;}
  if(wantsBuy){go("home");toast(t("rowMarket"));return;}
  const hit=BIZ.find(b=>s.includes(b.c.toLowerCase())||s.includes(b.ck));
  if(hit){openBiz(hit.id);return;}
  openAsk("",said);
}

/* ================= events ================= */
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-go]"); if(tab){go(tab.dataset.go);return;}
  const biz=e.target.closest("[data-biz]"); if(biz){openBiz(biz.dataset.biz);return;}
  const cat=e.target.closest("[data-cat]"); if(cat){const b=BIZ.find(x=>x.c===cat.dataset.cat);
    b?openBiz(b.id):toast(cat.dataset.cat);return;}
  const dot=e.target.closest("[data-dot]"); if(dot){goSlide(+dot.dataset.dot);return;}
  const day=e.target.closest("[data-day]"); if(day){day.parentNode.querySelectorAll(".slot").forEach(x=>x.classList.remove("on"));day.classList.add("on");return;}
  const slot=e.target.closest("[data-slot]"); if(slot){slot.parentNode.querySelectorAll(".slot").forEach(x=>x.classList.remove("on"));slot.classList.add("on");return;}
  const sz=e.target.closest("[data-size]"); if(sz){scale=parseFloat(sz.dataset.size);
    $("screen").style.fontSize=(scale*100)+"%";closeSheet();paint();return;}
  const a=e.target.closest("[data-act]"); if(!a) return;
  const id=a.dataset.id||"";
  switch(a.dataset.act){
    case "biz": id?openBiz(id):openBizPortal(); break;
    case "bookday": openBookDay(id); break;
    case "booktime": openBookTime(id); break;
    case "bookdone": closeSheet(); toast(t("tBooked")); break;
    case "ask": openAsk(id); break;
    case "sendask": {
      const v=tidy(($("askIn")||{value:""}).value);
      if(v){const b=BIZ.find(x=>x.id===id);
        INBOX.unshift({n:b?b.n:"Lonera",nk:b?b.nk:"로네라",m:v,mk:v,st:"new"});
        viewInbox();}
      closeSheet(); toast(t("tSent")); break;
    }
    case "fav": {
      SAVED.includes(id)?SAVED=SAVED.filter(x=>x!==id):SAVED.push(id);
      viewSaved(); closeSheet(); toast(t("tSaved")); break;
    }
    case "lang": lang=lang==="en"?"ko":"en"; paint(); closeSheet(); break;
    case "size": openSize(); break;
    case "contrast": contrast=!contrast;
      document.querySelector(".phone").style.filter=contrast?"contrast(1.28)":"";
      viewYou(); break;
    case "aloud": toast(t("tAloud"));
      if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(
        document.querySelector(".view.on").innerText.slice(0,320));
        u.lang=lang==="ko"?"ko-KR":"en-CA";speechSynthesis.cancel();speechSynthesis.speak(u);} break;
    case "notif": openNotif(); break;
    case "help": openForm("help"); break;
    case "formdone": closeSheet(); toast(t("tPosted")); break;
    case "close": closeSheet(); break;
  }
});
function go(k){cur=k;document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("v-"+k).classList.add("on");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.go===k));
  $("screen").scrollTop=0;}

(function clock(){const el=$("clk");const f=()=>{const d=new Date();
  el.textContent=(d.getHours()%12||12)+":"+String(d.getMinutes()).padStart(2,"0");};f();setInterval(f,20000);})();

paint();
})();
</script>
